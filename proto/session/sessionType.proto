syntax = "proto3";

package ua.gov.diia.types.session;

option java_multiple_files = true;
option java_package = "ua.gov.diia.types.session";

enum SessionType {
  reserved 8, 10;
  reserved "CabinetUser", "PortalUser";

  Acquirer = 0;
  None = 1;
  Partner = 2;
  Temporary = 3;
  User = 4;
  EResident = 5;
  EResidentApplicant = 6;
  ServiceEntrance = 7;
  ServiceUser = 9;
}
